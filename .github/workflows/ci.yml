name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

  smoketest:
    name: Smoketest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up --build -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && break
            sleep 2
          done

      - name: App is reachable (HTTP 200)
        run: curl -f http://localhost:8080

      - name: VoiceVox proxy routes correctly
        run: |
          curl -sf -X POST "http://localhost:8080/voicevox/audio_query?text=テスト&speaker=1" \
            -H "Content-Type: application/json" -o /dev/null
          curl -sf -X POST "http://localhost:8080/voicevox/synthesis?speaker=1" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null

      - name: nginx cache returns HIT on repeated request
        run: |
          QUERY=$(curl -sf -X POST "http://localhost:8080/voicevox/audio_query?text=テスト&speaker=1" \
            -H "Content-Type: application/json")
          curl -sf -X POST "http://localhost:8080/voicevox/synthesis?speaker=1" \
            -H "Content-Type: application/json" -d "$QUERY" -o /dev/null
          STATUS=$(curl -sf -X POST "http://localhost:8080/voicevox/synthesis?speaker=1" \
            -H "Content-Type: application/json" -d "$QUERY" \
            -D - -o /dev/null | grep -i "x-cache-status" | tr -d '\r')
          echo "Cache status: $STATUS"
          echo "$STATUS" | grep -qi "HIT"

      - name: API rejects unauthenticated requests
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/me)
          echo "Status: $STATUS"
          test "$STATUS" = "401"

      - name: API register, login and progress round-trip
        run: |
          curl -sf -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' \
            -c /tmp/cookies.txt -o /dev/null
          curl -sf http://localhost:8080/api/auth/me -b /tmp/cookies.txt
          curl -sf -X PUT http://localhost:8080/api/progress/quiz-stats \
            -H "Content-Type: application/json" \
            -d '{"value":{"currentLevel":3}}' \
            -b /tmp/cookies.txt -o /dev/null
          RESULT=$(curl -sf http://localhost:8080/api/progress -b /tmp/cookies.txt)
          echo "Progress: $RESULT"
          echo "$RESULT" | grep -q '"currentLevel":3'

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down
