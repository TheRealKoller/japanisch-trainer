services:
  voicevox:
    image: python:3-alpine
    volumes:
      - ./scripts/voicevox-mock.py:/mock.py:ro
    command: python /mock.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50021/version')"]
      interval: 2s
      timeout: 5s
      retries: 15

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: japanisch
      POSTGRES_USER: japanisch
      POSTGRES_PASSWORD: ci-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japanisch"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://japanisch:ci-secret@db:5432/japanisch
      JWT_SECRET: ci-jwt-secret
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      voicevox:
        condition: service_healthy
      api:
        condition: service_healthy
