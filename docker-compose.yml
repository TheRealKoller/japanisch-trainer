services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:50021/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  generate-audio:
    image: node:22-alpine
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src/data:/app/src/data:ro
      - audio:/audio
    environment:
      VOICEVOX_URL: http://voicevox:50021
      AUDIO_OUT_DIR: /audio
    working_dir: /app
    command: node scripts/generate-audio.mjs
    depends_on:
      voicevox:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - audio:/usr/share/nginx/html/audio
    depends_on:
      generate-audio:
        condition: service_completed_successfully

volumes:
  audio:
