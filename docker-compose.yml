services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    command: ["gosu", "user", "/opt/python/bin/python3", "./run.py", "--voicelib_dir", "/opt/voicevox_core/", "--runtime_dir", "/opt/onnxruntime/lib", "--host", "0.0.0.0", "--cors_policy_mode", "all"]
    healthcheck:
      test: ["CMD", "/opt/python/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50021/version')"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  generate-audio:
    image: node:22-alpine
    volumes:
      - ./scripts:/app/scripts:ro,z
      - ./src/data:/app/src/data:ro,z
      - audio:/audio
    environment:
      VOICEVOX_URL: http://voicevox:50021
      AUDIO_OUT_DIR: /audio
    working_dir: /app
    command: node scripts/generate-audio.mjs
    depends_on:
      voicevox:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: japanisch
      POSTGRES_USER: japanisch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-japanisch-dev-only}
    volumes:
      # Ab dem postgres:18-Image liegt PGDATA unter /var/lib/postgresql/<major>/…
      # — Mount auf das Elternverzeichnis, sonst landen Daten im Container-Layer.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japanisch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://japanisch:${DB_PASSWORD:-japanisch-dev-only}@db:5432/japanisch
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Hinter TLS auf "true" setzen (Cookie nur über HTTPS)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - audio:/usr/share/nginx/html/audio
    depends_on:
      generate-audio:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"

volumes:
  audio:
  pgdata:
